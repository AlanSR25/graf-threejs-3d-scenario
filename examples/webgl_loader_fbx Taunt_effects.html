<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - FBX loader with Rain Effects</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader with Rain Effects<br />
        Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const manager = new THREE.LoadingManager();

        let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
        let mixer;

        const clock = new THREE.Clock();

        const params = {
            asset: 'Zombie Walk'
        };

        const assets = [
            'Zombie Walk',
            'morph_test'
        ];

        // Rain variables
        let rainParticles, rainGeometry, rainMaterial;
        let rainSpeed = 2;
        let rainColor = 0xaaaaaa;  // Initial light gray color
        let windStrength = 0; // Initially no wind
        let fogDensity = 0.002; // Initial fog density
        let fogColor = 0xaaaaaa; // Initial color (gray)

        init();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(100, 200, 300);

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(fogColor, fogDensity);

            const rgbeLoader = new RGBELoader();
            rgbeLoader.load('models/rgbe/shanghai_bund_4k.hdr', function (texture) {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = texture;
                scene.environment = texture;
            });

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 5);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 5);
            dirLight.position.set(0, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 180;
            dirLight.shadow.camera.bottom = -100;
            dirLight.shadow.camera.left = -120;
            dirLight.shadow.camera.right = 120;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x88ccff, 2, 300);
            pointLight.position.set(50, 150, 50);
            pointLight.castShadow = true;
            scene.add(pointLight);

            const pointLightHelper = new THREE.PointLightHelper(pointLight, 10);
            scene.add(pointLightHelper);

            // Floor with wood texture
            const textureLoader = new THREE.TextureLoader();
            const woodTexture = textureLoader.load('textures/wood.jpg');
            woodTexture.wrapS = THREE.RepeatWrapping;
            woodTexture.wrapT = THREE.RepeatWrapping;
            woodTexture.repeat.set(20, 20);

            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(2000, 2000),
                new THREE.MeshPhongMaterial({
                    map: woodTexture,
                    depthWrite: false
                })
            );
            mesh.rotation.x = -Math.PI / 2;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const grid = new THREE.GridHelper(2000, 20, 0x000000, 0x000000);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            // 3D Audio
            const listener = new THREE.AudioListener();
            camera.add(listener);

            const sound = new THREE.Audio(listener);
            const audioLoader = new THREE.AudioLoader();
            audioLoader.load('models/rgbe/rocky.mp3', function (buffer) {
                console.log("Audio loaded successfully");
                sound.setBuffer(buffer);
                sound.setLoop(true);
                sound.setVolume(0.5);
                sound.play();
            });

            // Initialize rain
            initRain();

            loader = new FBXLoader(manager);
            loadAsset(params.asset);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 100, 0);
            controls.update();

            window.addEventListener('resize', onWindowResize);
            
            // Add keyboard controls
            window.addEventListener('keydown', function(event) {
                if (event.code === 'ArrowUp') {
                    rainSpeed += 0.5; // Increase speed
                } else if (event.code === 'ArrowDown') {
                    rainSpeed = Math.max(0, rainSpeed - 0.5); // Decrease speed, minimum 0
                } else if (event.code === 'KeyR') {
                    rainColor = 0xff0000; // Change to red
                    rainMaterial.color.setHex(rainColor);
                } else if (event.code === 'KeyB') {
                    rainColor = 0x0000ff; // Change to blue
                    rainMaterial.color.setHex(rainColor);
                } else if (event.code === 'KeyG') {
                    rainColor = 0x00ff00; // Change to green
                    rainMaterial.color.setHex(rainColor);
                } else if (event.code === 'KeyW') {
                    rainColor = 0xffffff; // Change to white
                    rainMaterial.color.setHex(rainColor);
                } else if (event.code === 'KeyV') {
                    windStrength += 0.5; // Increase wind
                    if (windStrength > 5) {
                        windStrength = 0; // If too strong, reset to zero
                    }
                } else if (event.code === 'ArrowLeft') {
                    fogDensity = Math.max(0, fogDensity - 0.0005); // Make fog lighter
                    updateFog();
                } else if (event.code === 'ArrowRight') {
                    fogDensity = Math.min(0.1, fogDensity + 0.0005); // Make fog thicker
                    updateFog();
                } else if (event.code === 'KeyA') {
                    fogColor = 0xff0000; // Red
                    updateFog();
                } else if (event.code === 'KeyS') {
                    fogColor = 0x00ff00; // Green
                    updateFog();
                } else if (event.code === 'KeyD') {
                    fogColor = 0x0000ff; // Blue
                    updateFog();
                } else if (event.code === 'KeyF') {
                    fogColor = 0xffffff; // White
                    updateFog();
                }
            });

            stats = new Stats();
            container.appendChild(stats.dom);

            const gui = new GUI();
            gui.add(params, 'asset', assets).onChange(function (value) {
                loadAsset(value);
            });

            guiMorphsFolder = gui.addFolder('Morphs').hide();
        }

        function initRain() {
            rainGeometry = new THREE.BufferGeometry();
            const rainCount = 15000;

            const rainPositions = [];
            for (let i = 0; i < rainCount; i++) {
                rainPositions.push(
                    Math.random() * 1000 - 500,
                    Math.random() * 500,
                    Math.random() * 1000 - 500
                );
            }

            rainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(rainPositions, 3));

            rainMaterial = new THREE.PointsMaterial({
                color: rainColor,
                size: 0.95,
                transparent: true
            });

            rainParticles = new THREE.Points(rainGeometry, rainMaterial);
            scene.add(rainParticles);
        }

        function updateFog() {
            scene.fog.color.setHex(fogColor);
            scene.fog.density = fogDensity;
        }

        function loadAsset(asset) {
            loader.load('models/fbx/' + asset + '.fbx', function (group) {
                if (object) {
                    object.traverse(function (child) {
                        if (child.material) {
                            const materials = Array.isArray(child.material) ? child.material : [child.material];
                            materials.forEach(material => {
                                if (material.map) material.map.dispose();
                                material.dispose();
                            });
                        }

                        if (child.geometry) child.geometry.dispose();
                    });

                    scene.remove(object);
                }

                object = group;

                if (object.animations && object.animations.length) {
                    mixer = new THREE.AnimationMixer(object);
                    const action = mixer.clipAction(object.animations[0]);
                    action.play();
                } else {
                    mixer = null;
                }

                guiMorphsFolder.children.forEach((child) => child.destroy());
                guiMorphsFolder.hide();

                object.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.morphTargetDictionary) {
                            guiMorphsFolder.show();
                            const meshFolder = guiMorphsFolder.addFolder(child.name || child.uuid);
                            Object.keys(child.morphTargetDictionary).forEach((key) => {
                                meshFolder.add(child.morphTargetInfluences, child.morphTargetDictionary[key], 0, 1, 0.01);
                            });
                        }
                    }
                });

                scene.add(object);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);

            // Animate rain
            const positions = rainGeometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 1] -= rainSpeed * delta * 10; // Move down in Y
                positions[i] += windStrength * delta * 10; // Move in X (wind)

                if (positions[i + 1] < 0) { // If hits the ground
                    positions[i + 1] = 500; // Reset drop to top
                    positions[i] = Math.random() * 1000 - 500; // New random X position
                }
            }
            rainGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
            stats.update();
        }
    </script>
</body>
</html>
